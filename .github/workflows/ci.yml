name: check
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # mise.toml loads the person's .env (MY_PLACE_ID), which is never in git
      - run: touch .env
      - name: Lint and build
        run: mise run check
      - name: Type check
        run: mise run typecheck
